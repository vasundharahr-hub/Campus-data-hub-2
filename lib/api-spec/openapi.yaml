openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart Campus Information System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Student management
  - name: courses
    description: Course management
  - name: enrollments
    description: Course enrollment
  - name: fees
    description: Fee management
  - name: performance
    description: Performance analytics
  - name: dashboard
    description: Dashboard summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Students ──────────────────────────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: grade
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, average, rollNumber, createdAt] }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Student" }
    post:
      operationId: createStudent
      tags: [students]
      summary: Register a new student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "404":
          description: Not found
    put:
      operationId: updateStudent
      tags: [students]
      summary: Update student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentUpdate" }
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Courses ───────────────────────────────────────────────────────────────
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete course
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Enrollments ───────────────────────────────────────────────────────────
  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List all enrollments (optionally filtered by student or course)
      parameters:
        - name: studentId
          in: query
          schema: { type: integer }
        - name: courseId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enrollment" }
    post:
      operationId: createEnrollment
      tags: [enrollments]
      summary: Enroll a student in a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }

  /enrollments/{id}:
    delete:
      operationId: deleteEnrollment
      tags: [enrollments]
      summary: Remove an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Fees ──────────────────────────────────────────────────────────────────
  /fees:
    get:
      operationId: listFees
      tags: [fees]
      summary: List all fee records
      parameters:
        - name: studentId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [paid, unpaid, partial] }
      responses:
        "200":
          description: List of fee records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeeRecord" }
    post:
      operationId: createFee
      tags: [fees]
      summary: Create a fee record for a student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRecord" }

  /fees/{id}:
    put:
      operationId: updateFee
      tags: [fees]
      summary: Update a fee record (e.g. mark as paid)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeUpdate" }
      responses:
        "200":
          description: Updated fee record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRecord" }

  # ── Performance ───────────────────────────────────────────────────────────
  /performance:
    get:
      operationId: listPerformance
      tags: [performance]
      summary: List all performance records
      parameters:
        - name: studentId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Performance records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PerformanceRecord" }
    post:
      operationId: createPerformance
      tags: [performance]
      summary: Add performance/marks record for a student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerformanceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerformanceRecord" }

  /performance/{id}:
    put:
      operationId: updatePerformance
      tags: [performance]
      summary: Update a performance record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerformanceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerformanceRecord" }
    delete:
      operationId: deletePerformance
      tags: [performance]
      summary: Delete a performance record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level campus statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/grade-distribution:
    get:
      operationId: getGradeDistribution
      tags: [dashboard]
      summary: Grade distribution across all students
      responses:
        "200":
          description: Grade distribution
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GradeDistributionItem" }

  /dashboard/department-stats:
    get:
      operationId: getDepartmentStats
      tags: [dashboard]
      summary: Per-department student count and average marks
      responses:
        "200":
          description: Department stats
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentStat" }

  /dashboard/top-students:
    get:
      operationId: getTopStudents
      tags: [dashboard]
      summary: Top performing students
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Top students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Student" }

  /dashboard/fee-summary:
    get:
      operationId: getFeeSummary
      tags: [dashboard]
      summary: Fee collection summary (total, paid, outstanding)
      responses:
        "200":
          description: Fee summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeSummary" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # ── Student ──────────────────────────────────────────────────────────────
    Student:
      type: object
      required: [id, rollNumber, name, department, createdAt]
      properties:
        id: { type: integer }
        rollNumber: { type: string }
        name: { type: string }
        department: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        average: { type: ["number", "null"] }
        grade: { type: ["string", "null"] }
        createdAt: { type: string }

    StudentInput:
      type: object
      required: [name, department]
      properties:
        name: { type: string, minLength: 1 }
        department: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }

    StudentUpdate:
      type: object
      properties:
        name: { type: string }
        department: { type: string }
        email: { type: string }
        phone: { type: string }

    # ── Course ───────────────────────────────────────────────────────────────
    Course:
      type: object
      required: [id, name, code, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        description: { type: ["string", "null"] }
        credits: { type: ["integer", "null"] }
        instructor: { type: ["string", "null"] }
        createdAt: { type: string }

    CourseInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        description: { type: string }
        credits: { type: integer }
        instructor: { type: string }

    # ── Enrollment ───────────────────────────────────────────────────────────
    Enrollment:
      type: object
      required: [id, studentId, courseId, enrolledAt]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        courseId: { type: integer }
        studentName: { type: ["string", "null"] }
        courseName: { type: ["string", "null"] }
        courseCode: { type: ["string", "null"] }
        enrolledAt: { type: string }

    EnrollmentInput:
      type: object
      required: [studentId, courseId]
      properties:
        studentId: { type: integer }
        courseId: { type: integer }

    # ── Fee ──────────────────────────────────────────────────────────────────
    FeeRecord:
      type: object
      required: [id, studentId, tuitionFee, labFee, examFee, totalFee, status, createdAt]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        studentName: { type: ["string", "null"] }
        tuitionFee: { type: number }
        labFee: { type: number }
        examFee: { type: number }
        totalFee: { type: number }
        paidAmount: { type: number }
        status: { type: string }
        createdAt: { type: string }

    FeeInput:
      type: object
      required: [studentId, tuitionFee, labFee, examFee]
      properties:
        studentId: { type: integer }
        tuitionFee: { type: number }
        labFee: { type: number }
        examFee: { type: number }
        paidAmount: { type: number }

    FeeUpdate:
      type: object
      properties:
        tuitionFee: { type: number }
        labFee: { type: number }
        examFee: { type: number }
        paidAmount: { type: number }
        status: { type: string, enum: [paid, unpaid, partial] }

    # ── Performance ───────────────────────────────────────────────────────────
    PerformanceRecord:
      type: object
      required: [id, studentId, subject, marks, maxMarks, createdAt]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        studentName: { type: ["string", "null"] }
        subject: { type: string }
        marks: { type: number }
        maxMarks: { type: number }
        percentage: { type: ["number", "null"] }
        createdAt: { type: string }

    PerformanceInput:
      type: object
      required: [studentId, subject, marks, maxMarks]
      properties:
        studentId: { type: integer }
        subject: { type: string, minLength: 1 }
        marks: { type: number }
        maxMarks: { type: number }

    PerformanceUpdate:
      type: object
      properties:
        subject: { type: string }
        marks: { type: number }
        maxMarks: { type: number }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalStudents, totalCourses, totalEnrollments, averageMarks, gradeACount, gradeBCount, gradeCCount, gradeDCount]
      properties:
        totalStudents: { type: integer }
        totalCourses: { type: integer }
        totalEnrollments: { type: integer }
        averageMarks: { type: number }
        gradeACount: { type: integer }
        gradeBCount: { type: integer }
        gradeCCount: { type: integer }
        gradeDCount: { type: integer }

    GradeDistributionItem:
      type: object
      required: [grade, count]
      properties:
        grade: { type: string }
        count: { type: integer }

    DepartmentStat:
      type: object
      required: [department, studentCount, averageMarks]
      properties:
        department: { type: string }
        studentCount: { type: integer }
        averageMarks: { type: number }

    FeeSummary:
      type: object
      required: [totalFees, totalPaid, totalOutstanding, paidCount, unpaidCount, partialCount]
      properties:
        totalFees: { type: number }
        totalPaid: { type: number }
        totalOutstanding: { type: number }
        paidCount: { type: integer }
        unpaidCount: { type: integer }
        partialCount: { type: integer }
